name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 仅打包 Windows x64 安装包 (x64-setup.exe / NSIS)
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          # Ubuntu x64 (.deb)
          - platform: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: deb
          # Ubuntu arm64 (.deb，ARM64 原生 runner)
          - platform: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: deb

    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2.9.1
        with:
          workspaces: src-tauri -> target

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.8

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install

      # Linux 需要 Tauri 2 的系统依赖（webkit2gtk-4.1 等）
      - name: Install Linux system dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'ADM-BE v__VERSION__'
          releaseDraft: false
          prerelease: false
          # 每个平台只产出指定格式的包：Windows x64-setup.exe / Ubuntu x64+arm64 (.deb)
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Windows 自签名
        if: matrix.platform == 'windows-latest'
        shell: powershell
        run: |
          Write-Host "创建自签名证书"
          $Cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=ADM-BE Self-Signed Cert" -CertStoreLocation Cert:\CurrentUser\My -NotAfter (Get-Date).AddYears(10)
          Write-Host "证书指纹: $($Cert.Thumbprint)"

          # 签名 NSIS 安装包（发布产物 x64-setup.exe，实际位于 bundle/nsis 目录）
          $Setup = Get-ChildItem -Path "src-tauri\target" -Recurse -Filter "*-setup.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($Setup) {
            Write-Host "对安装包签名: $($Setup.FullName)"
            Set-AuthenticodeSignature -FilePath $Setup.FullName -Certificate $Cert -HashAlgorithm SHA256
            Get-AuthenticodeSignature -FilePath $Setup.FullName | Format-List
          } else {
            Write-Warning "未找到 *-setup.exe，安装包未被签名"
          }

          # 同时签名主程序二进制（release 目录下的 ADM-BE.exe，便于直接分发）
          $App = Get-ChildItem -Path "src-tauri\target" -Recurse -Filter "ADM-BE.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($App) {
            Write-Host "对主程序签名: $($App.FullName)"
            Set-AuthenticodeSignature -FilePath $App.FullName -Certificate $Cert -HashAlgorithm SHA256
            Get-AuthenticodeSignature -FilePath $App.FullName | Format-List
          } else {
            Write-Warning "未找到 ADM-BE.exe"
          }
