<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ADM-BE</title>
  <style>
    /* ===== 主题变量：默认「暗夜紫」，其余主题通过 <html data-theme> 覆盖 =====
       全部前端视图内联在同一文档中，故 :root 变量对所有视图生效 */
    :root {
      --c-bg: #1a1a2e;
      --c-bg-deep: #0d1117;
      --c-panel: #16213e;
      --c-panel-2: #0f3460;
      --c-raise: #1c2331;
      --c-raise-2: #21262d;
      --c-border: #2a2a4e;
      --c-border-soft: #1a1a3e;
      --c-border-hi: #3a3a5e;
      --c-accent: #6c63ff;
      --c-accent-2: #5a52d5;
      --c-accent-rgb: 108, 99, 255;
      --c-text: #e0e0e0;
      --c-text-2: #a0a0c0;
      --c-text-3: #8080a0;
      --c-text-4: #606080;
      --c-text-hi: #ffffff;
      --c-overlay: rgba(255, 255, 255, 0.1);
      --c-overlay-strong: rgba(255, 255, 255, 0.2);
      /* 原生控件（下拉弹层/输入框等）跟随暗色渲染，防止 Linux 下白底白字 */
      color-scheme: dark;
    }
    html[data-theme="vscode"] {
      --c-bg: #1e1e1e; --c-bg-deep: #181818; --c-panel: #252526; --c-panel-2: #2d2d30;
      --c-raise: #2a2d2e; --c-raise-2: #37373d; --c-border: #3c3c3c; --c-border-soft: #2b2b2b;
      --c-border-hi: #4e4e52; --c-accent: #4a9eff; --c-accent-2: #3b82d6; --c-accent-rgb: 74, 158, 255;
      --c-text: #d4d4d4; --c-text-2: #a6a6a6; --c-text-3: #858585; --c-text-4: #6a6a6a; --c-text-hi: #ffffff;
    }
    html[data-theme="onedark"] {
      --c-bg: #282c34; --c-bg-deep: #21252b; --c-panel: #21252b; --c-panel-2: #2c313a;
      --c-raise: #2c313a; --c-raise-2: #3a3f4b; --c-border: #3a3f4b; --c-border-soft: #21252b;
      --c-border-hi: #4b5263; --c-accent: #61afef; --c-accent-2: #4d8fce; --c-accent-rgb: 97, 175, 239;
      --c-text: #abb2bf; --c-text-2: #9da5b4; --c-text-3: #7f848e; --c-text-4: #5c6370; --c-text-hi: #ffffff;
    }
    html[data-theme="light"] {
      --c-bg: #ffffff; --c-bg-deep: #f6f8fa; --c-panel: #f3f3f3; --c-panel-2: #ffffff;
      --c-raise: #eaeaea; --c-raise-2: #e1e4e8; --c-border: #d0d7de; --c-border-soft: #e1e4e8;
      --c-border-hi: #bcc4cc; --c-accent: #0066b8; --c-accent-2: #005a9e; --c-accent-rgb: 0, 102, 184;
      --c-text: #1f2328; --c-text-2: #4b5563; --c-text-3: #6a737d; --c-text-4: #8a94a0; --c-text-hi: #000000;
      --c-overlay: rgba(0, 0, 0, 0.05); --c-overlay-strong: rgba(0, 0, 0, 0.1);
      color-scheme: light;
    }
    html[data-theme="sepia"] {
      --c-bg: #fdf6e3; --c-bg-deep: #f4ecd8; --c-panel: #eee8d5; --c-panel-2: #fbf6e6;
      --c-raise: #e7dfc6; --c-raise-2: #ddd6bd; --c-border: #ddd2b0; --c-border-soft: #e7ddc4;
      --c-border-hi: #cabf98; --c-accent: #b5651d; --c-accent-2: #99551a; --c-accent-rgb: 181, 101, 29;
      --c-text: #586e75; --c-text-2: #657b83; --c-text-3: #839496; --c-text-4: #93a1a1; --c-text-hi: #073642;
      --c-overlay: rgba(101, 90, 40, 0.08); --c-overlay-strong: rgba(101, 90, 40, 0.16);
      color-scheme: light;
    }
    html[data-theme="github"] {
      --c-bg: #0d1117; --c-bg-deep: #010409; --c-panel: #161b22; --c-panel-2: #21262d;
      --c-raise: #1c2128; --c-raise-2: #21262d; --c-border: #30363d; --c-border-soft: #21262d;
      --c-border-hi: #444c56; --c-accent: #4493f8; --c-accent-2: #2f81f7; --c-accent-rgb: 68, 147, 248;
      --c-text: #c9d1d9; --c-text-2: #adbac7; --c-text-3: #8b949e; --c-text-4: #6e7681; --c-text-hi: #ffffff;
    }
    html[data-theme="dracula"] {
      --c-bg: #282a36; --c-bg-deep: #21222c; --c-panel: #21222c; --c-panel-2: #343746;
      --c-raise: #343746; --c-raise-2: #44475a; --c-border: #44475a; --c-border-soft: #343746;
      --c-border-hi: #6272a4; --c-accent: #bd93f9; --c-accent-2: #a77bea; --c-accent-rgb: 189, 147, 249;
      --c-text: #f8f8f2; --c-text-2: #d5d6e0; --c-text-3: #a0a1b8; --c-text-4: #6272a4; --c-text-hi: #ffffff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--c-bg);
      color: var(--c-text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    #view-root {
      flex: 1;
      width: 100%;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: var(--c-bg);
    }

    #view-root.hidden { display: none; }

    #hardware-bar {
      display: flex;
      align-items: center;
      gap: 0;
      background: var(--c-panel-2);
      padding: 4px 16px;
      font-size: 12px;
      color: var(--c-text-2);
      border-top: 1px solid var(--c-border-soft);
      flex-shrink: 0;
    }

    #home-btn,
    #settings-btn,
    #benchmark-btn {
      cursor: pointer;
      font-size: 13px;
      padding: 2px 10px;
      border-right: 1px solid var(--c-border);
      margin-right: 10px;
      transition: color 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1px;
    }

    .btn-icon {
      font-size: 20px;
      line-height: 1;
    }

    .btn-text {
      font-size: 11px;
      font-weight: 500;
    }

    #home-btn:hover,
    #settings-btn:hover,
    #benchmark-btn:hover {
      color: var(--c-accent);
    }

    #home-btn.active,
    #settings-btn.active,
    #benchmark-btn.active {
      background: rgba(var(--c-accent-rgb), 0.20);
      color: var(--c-text-hi);
      border-radius: 6px;
      border-right-color: transparent;
    }
    #home-btn.active .btn-icon,
    #settings-btn.active .btn-icon,
    #benchmark-btn.active .btn-icon {
      color: var(--c-accent);
    }

    #hw-items {
      display: flex;
      align-items: center;
      margin-left: auto;
    }

    .hw-item {
      padding: 0 12px;
      border-right: 1px solid var(--c-border);
    }

    .hw-item:last-child {
      border-right: none;
    }

    .hw-label {
      color: var(--c-text-2);
      margin-right: 4px;
      white-space: nowrap;
      max-width: 200px;
      overflow: hidden;
      text-overflow: ellipsis;
      display: inline-block;
      vertical-align: bottom;
    }

    .hw-value {
      color: var(--c-text-hi);
      font-weight: 600;
    }

    /* 更新弹窗样式 */
    #update-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.6);
      z-index: 9999;
      justify-content: center;
      align-items: center;
    }
    #update-overlay.show {
      display: flex;
    }
    #update-dialog {
      background: var(--c-panel);
      border: 1px solid var(--c-border);
      border-radius: 12px;
      padding: 28px 32px;
      max-width: 460px;
      width: 90%;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    #update-dialog .update-icon { font-size: 40px; text-align: center; margin-bottom: 12px; }
    #update-dialog .update-title { font-size: 20px; font-weight: 600; color: var(--c-text-hi); text-align: center; margin-bottom: 8px; }
    #update-dialog .update-desc { font-size: 14px; color: var(--c-text-2); text-align: center; margin-bottom: 20px; line-height: 1.6; }
    #update-dialog .update-info-row { display: flex; justify-content: center; gap: 24px; margin-bottom: 20px; font-size: 13px; }
    #update-dialog .update-info-row .info-item { text-align: center; }
    #update-dialog .update-info-row .info-label { color: var(--c-text-3); font-size: 11px; }
    #update-dialog .update-info-row .info-value { color: var(--c-text); font-weight: 500; margin-top: 2px; }
    #update-dialog .update-buttons { display: flex; gap: 12px; justify-content: center; }
    #update-dialog .update-btn-primary { background: var(--c-accent); color: #fff; border: none; padding: 10px 28px; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; transition: background 0.2s; }
    #update-dialog .update-btn-primary:hover { background: var(--c-accent-2); }
    #update-dialog .update-btn-secondary { background: var(--c-overlay); color: var(--c-text); border: none; padding: 10px 28px; border-radius: 8px; font-size: 14px; cursor: pointer; transition: background 0.2s; }
    #update-dialog .update-btn-secondary:hover { background: var(--c-overlay-strong); }
    #update-dialog .checking-text { text-align: center; color: var(--c-text-3); font-size: 14px; padding: 20px 0; }
    #update-dialog .checking-text .spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid var(--c-border); border-top-color: var(--c-accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 8px; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* 视图切换 loading 动画（模块加载超时才显示，避免瞬时切换时 spinner 闪烁） */
    .view-loading { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 14px; }
    .view-loading-spinner { width: 36px; height: 36px; border: 3px solid var(--c-border); border-top-color: var(--c-accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
    .view-loading-text { font-size: 13px; color: var(--c-text-3); }

    .global-toast {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      background: rgba(20,20,40,0.96);
      color: var(--c-text);
      padding: 18px 28px;
      border-radius: 10px;
      font-size: 15px;
      z-index: 9999;
      border: 1px solid var(--c-border-hi);
      box-shadow: 0 8px 30px rgba(0,0,0,0.5);
      cursor: default;
    }


  </style>
  <script>
    // 主题：尽早同步应用（在 body 渲染前），避免首屏闪烁
    // 名称字段为显示文案（设置页主题卡片用），id 才是持久化键；i18n 未就绪时保持中文
    window.__ADM_THEMES = [
      { id: "default", name: "暗夜紫",      colors: ["#1a1a2e", "#16213e", "#6c63ff"] },
      { id: "vscode",  name: "VS Code 深色", colors: ["#1e1e1e", "#252526", "#4a9eff"] },
      { id: "onedark", name: "One Dark",     colors: ["#282c34", "#21252b", "#61afef"] },
      { id: "github",  name: "GitHub 深色",  colors: ["#0d1117", "#161b22", "#4493f8"] },
      { id: "dracula", name: "Dracula",      colors: ["#282a36", "#44475a", "#bd93f9"] },
      { id: "light",   name: "白色亮色",    colors: ["#ffffff", "#f3f3f3", "#0066b8"] },
      { id: "sepia",   name: "淡黄护眼",    colors: ["#fdf6e3", "#eee8d5", "#b5651d"] }
    ];
    window.getTheme = function () {
      try { return localStorage.getItem("adm-theme") || "vscode"; } catch (_) { return "vscode"; }
    };
    window.applyTheme = function (id) {
      var valid = window.__ADM_THEMES.some(function (t) { return t.id === id; });
      var theme = valid ? id : "default";
      if (theme === "default") document.documentElement.removeAttribute("data-theme");
      else document.documentElement.setAttribute("data-theme", theme);
      try { localStorage.setItem("adm-theme", theme); } catch (_) {}
    };
    window.applyTheme(window.getTheme());
  </script>
</head>
<body>
  <!-- 更新弹窗 -->
  <div id="update-overlay">
    <div id="update-dialog">
      <div id="update-content"></div>
    </div>
  </div>

  <div id="app">
    <div id="view-root"></div>
    <div id="hardware-bar">
      <div id="home-btn" onclick="location.hash='#/list'">
        <span class="btn-icon">&#8962;</span>
        <span class="btn-text" data-i18n="首页">首页</span>
      </div>
      <div id="settings-btn" onclick="location.hash='#/settings'">
        <span class="btn-icon">&#9881;</span>
        <span class="btn-text" data-i18n="设置">设置</span>
      </div>
      <div id="benchmark-btn" onclick="location.hash='#/benchmark'">
        <span class="btn-icon">&#9889;</span>
        <span class="btn-text" data-i18n="测试">测试</span>
      </div>
      <div id="hw-items">
        <div class="hw-item">
          <span class="hw-label" data-i18n="内存">内存</span>
          <span class="hw-value" id="ram-info">--</span>
        </div>
        <div class="hw-item">
          <span class="hw-label" id="gpu-label" data-i18n="显存">显存</span>
          <span class="hw-value" id="vram-info">--</span>
        </div>
        <div class="hw-item">
          <span class="hw-label">CPU</span>
          <span class="hw-value" id="cpu-info">--</span>
        </div>
      </div>

    </div>


  </div>

  <script type="module">
    // ===== 全局基础设施 =====
    const invoke = window.__TAURI__?.core?.invoke || window.__TAURI_INTERNALS__?.invoke;
    const listen = window.__TAURI__?.event?.listen || window.__TAURI_INTERNALS__?.listen;
    window.__adm_invoke = invoke;
    window.__adm_listen = listen;

    // 预加载 i18n 模块并同步绑定 t()（顶层 await，后续所有动态文本走 t）
    const _i18n = await import("./i18n.js");
    const t = _i18n.t;
    let _settingsLang = null;
    try { _settingsLang = (await invoke("load_settings")).language; } catch (_) {}
    _i18n.syncLanguageFromSettings({ language: _settingsLang });
    _i18n.applyToDOM(document);

    // 底部硬件栏（壳层常驻）禁用右键，屏蔽浏览器默认菜单
    document.getElementById("hardware-bar").addEventListener("contextmenu", function(e) { e.preventDefault(); });

    // 共享状态（提升原 model_list 局部变量，跨视图共享）
    window.__adm_state = {
      systemInfo: null,
      runningModelId: null,
      runningModelPort: null,
      localModels: [],
      partFiles: {},
      downloadingModels: {},
      modelList: [],
      modelTypes: [],
      currentTypeFilter: "all",

    };

    let systemInfo = null;
    let hwinfo = { cpu: null, ram: null, gpu: null, os: null };

    function formatBytes(bytes) {
      if (bytes === 0) return "0 B";
      const k = 1024;
      const sizes = ["B", "KB", "MB", "GB", "TB"];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + sizes[i];
    }

    // HTML 转义：远端 update.json 下发的版本号 / 地址会拼进弹窗 innerHTML，需真实转义防注入
    function escHtml(s) {
      if (s == null) return "";
      return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }



    // ===== 导航激活态 =====
    function setActiveNav(id) {
      ["home-btn", "settings-btn", "benchmark-btn"].forEach(function (b) {
        const el = document.getElementById(b);
        if (el) el.classList.toggle("active", b === id);
      });
    }

    // ===== 更新弹窗 =====
    function showUpdateDialog(html) {
      document.getElementById("update-content").innerHTML = html;
      document.getElementById("update-overlay").classList.add("show");
    }

    function hideUpdateDialog() {
      document.getElementById("update-overlay").classList.remove("show");
    }

    function openUrl(url) {
      // 仅允许 http(s)，防止远端下发的 download_url 被注入 javascript:/file: 等危险协议
      if (!/^https?:\/\//i.test(String(url || "").trim())) {
        console.warn("[index] 拒绝打开非 http(s) 链接:", url);
        return;
      }
      if (window.__TAURI__?.core) {
        window.__TAURI__.core.invoke("plugin:opener|open_url", { url: url });
      } else if (window.__TAURI_INTERNALS__?.invoke) {
        window.__TAURI_INTERNALS__.invoke("plugin:opener|open_url", { url: url });
      } else {
        window.open(url, "_blank");
      }
    }

    async function checkForUpdate(silent) {
      silent = silent || false;
      try {
        if (!silent) {
          showUpdateDialog('<div class="checking-text"><span class="spinner"></span>' + t("正在检查更新...") + '</div>');
        }
        const result = await invoke("check_update");

        if (result.has_update) {
          const html = `
            <div class="update-icon">📥</div>
            <div class="update-title">${t("发现新版本")}</div>
            <div class="update-desc">${t("有新版本可用，是否前往下载？")}</div>
            <div class="update-info-row">
              <div class="info-item"><div class="info-label">${t("当前版本")}</div><div class="info-value">v${escHtml(result.current_version)}</div></div>
              <div class="info-item"><div class="info-label">${t("最新版本")}</div><div class="info-value">v${escHtml(result.remote_version)}</div></div>
            </div>
            <div class="update-buttons">
              <button class="update-btn-primary" onclick="openUrl('${escHtml(result.download_url)}')">${t("下载更新")}</button>
              <button class="update-btn-secondary" onclick="hideUpdateDialog()">${t("稍后再说")}</button>
            </div>`;
          showUpdateDialog(html);
          return;
        }

        if (!silent) {
          showUpdateDialog(`
            <div class="update-icon">✅</div>
            <div class="update-title">${t("已是最新版本")}</div>
            <div class="update-desc">${t("当前版本 v")}${result.current_version} ${t("已是最新")}</div>
            <div class="update-buttons" style="margin-top:16px;">
              <button class="update-btn-secondary" onclick="hideUpdateDialog()">${t("确定")}</button>
            </div>`);
        }
      } catch (e) {
        if (!silent) {
          showUpdateDialog(`
            <div class="update-icon">❌</div>
            <div class="update-title">${t("检查更新失败")}</div>
            <div class="update-desc">${e}</div>
            <div class="update-buttons" style="margin-top:16px;">
              <button class="update-btn-secondary" onclick="hideUpdateDialog()">${t("确定")}</button>
            </div>`);
        }
      }
    }

    function showComingSoon(msg) {
      let tip = document.getElementById("os-tip");
      if (!tip) {
        tip = document.createElement("div");
        tip.id = "os-tip";
        tip.className = "global-toast";
        document.body.appendChild(tip);
      }
      tip.textContent = msg || t("该功能即将开放，敬请期待");
      tip.style.display = "block";
      clearTimeout(showComingSoon._t);
      showComingSoon._t = setTimeout(function () { tip.style.display = "none"; }, 2500);
    }

    // 暴露给视图模块（如 settings 调用）
    window.ADM = {
      showUpdateDialog,
      hideUpdateDialog,
      checkForUpdate,
    };
    window.hideUpdateDialog = hideUpdateDialog;
    window.openUrl = openUrl;

    // ===== 硬件栏 =====
    function updateHardwareBar() {
      if (!systemInfo) return;
      try {
        document.getElementById("ram-info").textContent = formatBytes(systemInfo.total_ram);
        if (systemInfo.has_gpu && systemInfo.total_vram > 0) {
          document.getElementById("vram-info").textContent = formatBytes(systemInfo.total_vram);
          if (hwinfo.gpu && hwinfo.gpu.model) {
            const gpuLabel = document.getElementById("gpu-label");
            gpuLabel.textContent = hwinfo.gpu.model;
            gpuLabel.removeAttribute("data-i18n"); // 型号优先，语言切换不再覆盖
          }
        } else {
          document.getElementById("vram-info").textContent = t("无显卡");
        }
        const cpuCores = systemInfo.cpu_physical_cores;
        const cpuThreads = systemInfo.cpu_logical_cores;
        if (hwinfo.cpu && hwinfo.cpu.model) {
          document.getElementById("cpu-info").textContent = hwinfo.cpu.model + " " + cpuCores + "C/" + cpuThreads + "T";
        } else {
          document.getElementById("cpu-info").textContent = cpuCores + "C/" + cpuThreads + "T";
        }
      } catch (e) {
        console.error("更新硬件栏失败:", e);
        document.getElementById("ram-info").textContent = t("加载失败");
      }
    }

    // ===== 路由器 =====
    const routes = {
      "/list":     { load: () => import("./views/model_list.js"),     nav: "home-btn" },
      "/settings": { load: () => import("./views/settings.js"),       nav: "settings-btn" },
      "/benchmark": { load: () => import("./views/benchmark.js"),   nav: "benchmark-btn" },
    };

    let currentView = null;
    let renderSeq = 0;

    // 卸载旧视图并展示 loading 动画（仅在模块加载超过阈值时调用）
    function showViewLoading() {
      if (currentView && currentView.unmount) { try { currentView.unmount(); } catch (_) {} }
      currentView = null;
      document.getElementById("view-root").innerHTML =
        '<div class="view-loading"><div class="view-loading-spinner"></div><div class="view-loading-text">' + t("页面加载中...") + '</div></div>';
    }

    async function renderRoute() {
      const seq = ++renderSeq;
      const hash = location.hash || "#/list";
      console.log("[index] renderRoute() hash:", hash);
      const clean = hash.replace(/^#/, "");
      const qIndex = clean.indexOf("?");
      const path = qIndex >= 0 ? clean.substring(0, qIndex) : clean;
      const queryStr = qIndex >= 0 ? clean.substring(qIndex + 1) : "";
      const params = {};
      if (queryStr) {
        queryStr.split("&").forEach((pair) => {
          const idx = pair.indexOf("=");
          const k = decodeURIComponent(pair.substring(0, idx >= 0 ? idx : pair.length));
          const v = idx >= 0 ? decodeURIComponent(pair.substring(idx + 1)) : "";
          params[k] = v;
        });
      }

      const route = routes[path] || routes["/list"];
      setActiveNav(route.nav);

      // 先异步加载模块（已缓存时瞬时完成），旧视图保持显示避免黑屏闪烁；
      // 超过 120ms 未就绪才切换为 loading 动画
      const loadingTimer = setTimeout(function() {
        // 只允许当前最新路由展示 loading；旧路由的延迟定时器不得卸载已挂载的新视图
        if (seq === renderSeq) showViewLoading();
      }, 120);
      let mod = null;
      let loadErr = null;
      try {
        mod = await route.load();
      } catch (e) {
        loadErr = e;
      }
      clearTimeout(loadingTimer);
      if (seq !== renderSeq) return; // 加载期间路由已切换，本次渲染作废

      const root = document.getElementById("view-root");
      if (currentView && currentView.unmount) currentView.unmount();
      currentView = null;
      root.innerHTML = "";

      if (loadErr) {
        console.error("[index] 加载视图失败:", loadErr);
        root.innerHTML = '<div style="padding:40px;color:#ff6b6b;">' + t("页面加载失败: ") + loadErr + '</div>';
        return;
      }

      try {
        const view = mod.default;
        currentView = view;
        console.log("[index] 加载视图模块:", path);
        view.mount(root, params);
        console.log("[index] 视图已挂载:", path);
      } catch (e) {
        console.error("[index] 挂载视图失败:", e);
        root.innerHTML = '<div style="padding:40px;color:#ff6b6b;">' + t("页面加载失败: ") + e + '</div>';
      }
    }

    window.addEventListener("hashchange", renderRoute);

    // ===== 初始化 =====
    async function init() {
      console.log("[index] init() 开始初始化");
      try {
        systemInfo = await invoke("get_system_info");
        window.__adm_state.systemInfo = systemInfo;

        try {
          hwinfo.cpu = await invoke("plugin:hwinfo|get_cpu_info");
          hwinfo.ram = await invoke("plugin:hwinfo|get_ram_info");
          hwinfo.gpu = await invoke("plugin:hwinfo|get_gpu_info");
          hwinfo.os = await invoke("plugin:hwinfo|get_os_info");

          if (hwinfo.ram && hwinfo.ram.sizeMb) systemInfo.total_ram = hwinfo.ram.sizeMb * 1024 * 1024;
          if (hwinfo.gpu && hwinfo.gpu.vramMb) { systemInfo.total_vram = hwinfo.gpu.vramMb * 1024 * 1024; systemInfo.has_gpu = true; }
          if (hwinfo.cpu && hwinfo.cpu.threads) systemInfo.cpu_logical_cores = hwinfo.cpu.threads;
        } catch (hwe) {
          console.warn("hwinfo 插件获取失败，使用原有数据:", hwe);
        }

        updateHardwareBar();
        setActiveNav("home-btn");
        console.log("[index] 系统信息获取完成:", systemInfo);
      } catch (e) {
        console.error("[index] 获取系统信息失败:", e);
        document.getElementById("ram-info").textContent = t("加载失败");
      }
      console.log("[index] init() 完成");
    }

    // ===== 全局事件监听（不随视图切换释放，保证切页后状态不丢） =====
    // 所有事件只更新 __adm_state，视图模块的 handleTauriEvent 只做 DOM 更新
    var st = window.__adm_state;
    st.pullProgress = {};
    st.downloadingModels = st.downloadingModels || {};

    if (typeof listen === "function") {
      var globalEvents = ["download-progress", "download-complete", "download-error", "model-pull-progress", "model-started", "model-stopped", "model-error", "image-push-progress", "model-sync-progress"];
      globalEvents.forEach(function(ev) {
        listen(ev, function(event) {
          var p = event.payload || {};
          var mid = p.model_id;
          switch (ev) {
            case "download-progress": {
              st.downloadingModels[mid] = p.progress;
              break;
            }
            case "download-complete": {
              delete st.downloadingModels[mid];
              if (p.all) {
                // 多文件目录模型全部完成
                var model = (st.modelList || []).find(function(m) { return m.model_id === mid; });
                var local = (st.localModels || []).find(function(m) { return m.model_id === mid; });
                if (model && model.model_download_files) {
                  var names = model.model_download_files.map(function(u) { return u.split('/').pop(); }).filter(Boolean);
                  if (local) names.forEach(function(n) { if (!local.files.includes(n)) local.files.push(n); });
                  else st.localModels.push({ model_id: mid, files: names });
                }
              }
              delete st.partFiles[mid];
              break;
            }
            case "download-error": {
              delete st.downloadingModels[mid];
              break;
            }
            case "model-pull-progress": {
              if (mid) { st.startingModelId = mid; st.pullProgress[mid] = p.progress || 0; }
              break;
            }
            case "model-started": {
              st.runningModelId = mid;
              st.runningModelPort = p.port;
              st.startingModelId = null;
              break;
            }
            case "model-stopped": {
              st.runningModelId = null;
              st.runningModelPort = null;
              st.startingModelId = null;
              break;
            }
            case "model-error": {
              st.startingModelId = null;
              break;
            }
          }
          // 转发给当前视图的 handleTauriEvent（做 DOM 更新）
          if (currentView && currentView.handleTauriEvent) {
            try { currentView.handleTauriEvent(ev, p); } catch (_) {}
          }
        });
      });
    }

    setTimeout(() => { checkForUpdate(true); }, 3000);

    init();
    renderRoute();
  </script>
</body>
</html>
